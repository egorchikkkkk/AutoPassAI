[project]
name = "autopassai"
version = "0.1.2"
description = "Service for license plates recognition."
readme = "README.md"
authors = [
    { name = "egorchikkkkk", email = "egoriachmennikov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
ml = [
    "matplotlib>=3.11.2",
    "mlflow==3.17.1",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = [
	"E",
	"F",
	"I",
	"UP",
	"B",
	"ASYNC",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/autopassai"]
branch = true

[tool.coverage.report]
exclude_also = [
	"if TYPE_CHECKING:",
	"if __name__ == .__main__.:"
]
